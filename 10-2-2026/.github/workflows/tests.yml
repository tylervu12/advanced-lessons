name: Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      # Separate steps make it clear which testing boundary failed in CI.
      - run: python -m pytest -m unit -v
      - run: python -m pytest -m integration -v
      - run: python -m pytest -m e2e -v
